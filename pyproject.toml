[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soomaalipy"
version = "1.0.0"
description = "Luuqadda Barnaamijyada ee Af-Soomaaliga (Somali Python Programming Language)"
readme = "README.md"
authors = [{ name = "SoomaaliPy Contributors" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Somali",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Education",
]
requires-python = ">=3.8"

[project.scripts]
koor = "koor.cli:main"
somali = "soomaalipy.cli:main"
sompy = "soomaalipy.cli:main"
